<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Игротека Мухаммада</title>
<meta name="description" content="Бесплатные развивающие игры и раскраски для Мухаммада">
<meta name="theme-color" content="#BFE6FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@600;700;800;900&display=swap">
<style>/* Layout: «игровая полка» — небесный фон, крупные игрушечные карточки рядами */
:root {
  --sky: #BFE6FF;
  --sky2: #E6F5FF;
  --paper: #FFFFFF;
  --ink: #22314D;
  --ink2: #5A6A86;
  --shadow: #93BEDF;
  --sun: #FFC83D;
  --berry: #FF5C7A;
  --leaf: #2DBE6C;
  --ocean: #2B9BEA;
  --display: 'Comfortaa', 'Nunito', ui-rounded, system-ui, sans-serif;
  --body: 'Nunito', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --emoji: 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
  --r: 22px;
  --emsz: clamp(40px, 10.5vmin, 92px);
  --sec: #8A63F2;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 16px;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
  background-image: radial-gradient(circle at 12% 8%, #fff8 0 60px, transparent 61px), radial-gradient(circle at 88% 22%, #fff6 0 80px, transparent 81px);
  background-attachment: fixed;
}
#app { height: 100%; overflow-y: auto; overflow-x: hidden; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--ocean); outline-offset: 3px; }
input { font: inherit; user-select: text; -webkit-user-select: text; }
.em { font-family: var(--emoji); font-size: var(--emsz); line-height: 1.15; display: inline-block; }
.em.big { font-size: calc(var(--emsz) * 1.45); }
.em.huge { font-size: calc(var(--emsz) * 1.9); }
.muted { color: var(--ink2); }

.screen { min-height: 100%; display: flex; flex-direction: column; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 20px; }
.screen.game, .screen.color-screen { height: 100%; min-height: 0; overflow: hidden; gap: 6px; padding-block: 8px 10px; }

/* Кнопки */
.btn { border: 0; border-radius: 999px; background: var(--paper); box-shadow: 0 4px 0 var(--shadow); padding: 12px 20px; font-weight: 800; font-size: 17px; transition: transform .1s, box-shadow .1s; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.btn.big { font-size: clamp(17px, 4vmin, 22px); padding: 14px 24px; }
.btn.go { background: var(--leaf); color: #fff; box-shadow: 0 4px 0 #1C8A4C; }
.btn.ghost { background: #ffffffb0; }
.btn.danger { background: var(--berry); color: #fff; box-shadow: 0 4px 0 #B83350; }
.btn.mic { background: var(--ocean); color: #fff; box-shadow: 0 4px 0 #1A6FAF; }
.btn:disabled { opacity: .7; }
.icon-btn { flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--paper); box-shadow: 0 4px 0 var(--shadow); font-size: 22px; font-family: var(--emoji), var(--body); display: grid; place-items: center; padding: 0; }
.icon-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.icon-btn.back { font-family: var(--body); font-weight: 900; }
.chip { border: 0; border-radius: 999px; background: var(--paper); box-shadow: 0 3px 0 var(--shadow); padding: 8px 14px; font-weight: 800; white-space: nowrap; }
.chip.on { background: var(--ink); color: #fff; box-shadow: 0 3px 0 #0d1526; }
.count-chip { background: #ffffffa0; border-radius: 999px; padding: 6px 12px; font-weight: 800; white-space: nowrap; }

/* Главный */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.who { display: flex; align-items: center; gap: 10px; }
.avatar { width: 54px; height: 54px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; font-size: 32px; font-family: var(--emoji); box-shadow: 0 4px 0 #D9A21F; }
.who-n { font-family: var(--display); font-weight: 700; font-size: 20px; }
.who-a { color: var(--ink2); font-weight: 700; font-size: 14px; }
.top-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip.big { font-size: 15px; padding: 9px 14px; }
.chip.parent { background: var(--ink); color: #fff; box-shadow: 0 3px 0 #0d1526; }
.hero { background: linear-gradient(135deg, #FFE27A, #FFC83D 60%, #FFAD3D); border-radius: 28px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; box-shadow: 0 6px 0 #D99A1F; }
.hero-txt { min-width: 0; }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-weight: 900; font-size: 12px; color: #7A4B00; }
.hero h1 { font-family: var(--display); font-size: clamp(22px, 5vmin, 32px); margin: 4px 0 10px; text-wrap: balance; }
.steps { display: flex; gap: 8px; flex-wrap: wrap; }
.step { width: 52px; height: 52px; border-radius: 16px; background: #ffffffc8; display: grid; place-items: center; position: relative; }
.step .em { font-size: 30px; }
.step.done::after { content: '✓'; position: absolute; right: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--leaf); color: #fff; font-weight: 900; font-size: 14px; display: grid; place-items: center; }
.hero-go { font-size: 22px; padding: 16px 30px; }
.row { display: flex; flex-direction: column; gap: 8px; }
.row-h { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.row-h h2 { margin: 0; font-family: var(--display); font-size: 20px; flex: 1; }
.row-e { width: 38px; height: 38px; border-radius: 12px; background: var(--sec); display: grid; place-items: center; font-family: var(--emoji); font-size: 22px; }
.row-n { color: var(--ink2); font-weight: 800; }
.row-s { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; scrollbar-width: none; }
.row-s::-webkit-scrollbar { display: none; }
.gcard { flex: none; width: 138px; border: 0; background: var(--paper); border-radius: var(--r); box-shadow: 0 5px 0 var(--shadow); padding: 8px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; scroll-snap-align: start; transition: transform .12s; }
.gcard:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.gc-art { width: 100%; aspect-ratio: 1.25; border-radius: 16px; background: var(--sec); display: grid; place-items: center; background-image: radial-gradient(circle at 30% 25%, #ffffff55 0 22%, transparent 23%), radial-gradient(circle at 80% 85%, #ffffff33 0 18%, transparent 19%); }
.gc-art .em { font-size: 54px; filter: drop-shadow(0 3px 0 #0002); }
.gc-t { font-weight: 800; font-size: 15px; text-align: center; line-height: 1.15; min-height: 2.3em; display: flex; align-items: center; }
.gc-s { font-size: 12px; color: var(--ink2); font-weight: 700; min-height: 1.2em; }
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 14px; }
.ggrid .gcard { width: auto; }
.foot { text-align: center; color: var(--ink2); font-size: 13px; font-weight: 700; padding-top: 8px; }

/* Игра */
.ghead { display: flex; align-items: center; gap: 10px; }
.gtitle { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: clamp(16px, 4vmin, 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gt-e { font-family: var(--emoji); font-size: 26px; }
.dots { display: flex; gap: 6px; flex: none; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--shadow); }
.dots i.on { background: var(--sun); box-shadow: 0 0 0 2px #D9A21F; }
.prompt { font-family: var(--display); font-weight: 700; font-size: clamp(18px, 4.4vmin, 30px); text-align: center; min-height: 1.3em; text-wrap: balance; }
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2.4vmin, 20px); position: relative; }
.top { display: flex; justify-content: center; align-items: center; }
.opts { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: clamp(8px, 2vmin, 16px); width: min(100%, calc(var(--cols) * 172px)); }
.opt { border: 0; background: var(--paper); border-radius: var(--r); box-shadow: 0 5px 0 var(--shadow); padding: 8px; min-height: clamp(78px, 17vmin, 150px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; transition: transform .1s, opacity .2s; }
.opt:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }
.opt.ok { background: #DDF8E6; box-shadow: 0 5px 0 #6CCB93; animation: pop .45s; }
.opt.dim { opacity: .35; }
.opt.used { opacity: .25; pointer-events: none; }
.opt small { font-weight: 800; font-size: 14px; }
.opt.wide { min-height: clamp(90px, 22vmin, 180px); }
.opts.tight { gap: 8px; }
.opts.tight .opt { min-height: clamp(56px, 12vmin, 110px); }
.opts.tight .em { font-size: calc(var(--emsz) * .8); }
.shadow { filter: brightness(0) opacity(.78); }
.num { font-family: var(--display); font-weight: 700; font-size: calc(var(--emsz) * .9); line-height: 1; }
.num.big { font-size: calc(var(--emsz) * 1.1); }
.num.huge { font-size: calc(var(--emsz) * 2); }
.num.c0 { color: #E8302F; } .num.c1 { color: #1F7FD9; } .num.c2 { color: #1F9E52; } .num.c3 { color: #D97A00; } .num.c4 { color: #8A3FD1; } .num.c5 { color: #E0457B; }
.seq { display: flex; gap: clamp(4px, 1.5vmin, 12px); flex-wrap: wrap; justify-content: center; background: #ffffff90; border-radius: var(--r); padding: 10px 14px; }
.seq .em { font-size: calc(var(--emsz) * .8); }
.seq.big .em { font-size: var(--emsz); }
.em.q { width: 1.15em; height: 1.15em; border: 4px dashed var(--ink2); border-radius: 16px; display: inline-grid; place-items: center; font-family: var(--display); font-weight: 700; color: var(--ink2); font-size: calc(var(--emsz) * .75); }
.seq.curtain { animation: curtain .9s; }
.pairtop { display: flex; align-items: center; gap: 14px; }
.plus { font-family: var(--display); font-weight: 700; font-size: 40px; }
.half { display: inline-block; width: .6em; height: 1.2em; overflow: hidden; font-size: var(--emsz); line-height: 1.2em; vertical-align: middle; font-family: var(--emoji); }
.half i { display: block; width: 1.2em; text-align: center; font-style: normal; }
.half.r i { margin-left: -.6em; }
.halftop { display: flex; align-items: center; font-size: 1.5em; }
.halftop .half { font-size: calc(var(--emsz) * 1.45); }
.half.slot { border: 4px dashed var(--ink2); border-left: 0; border-radius: 0 18px 18px 0; }
.half.slot i { color: var(--ink2); font-family: var(--display); font-size: .5em; line-height: 2.4em; text-indent: -.6em; }
.target { background: #fff; border-radius: var(--r); padding: 10px; box-shadow: 0 5px 0 var(--shadow); }
.shp, .blob { width: calc(var(--emsz) * 1.1); height: calc(var(--emsz) * 1.1); }
.target .shp, .target .blob { width: calc(var(--emsz) * 1.4); height: calc(var(--emsz) * 1.4); }
.scene { width: 100%; max-width: 220px; }
.yn { display: flex; flex-direction: column; align-items: center; font-family: var(--emoji); font-size: calc(var(--emsz) * .9); }
.yn b { font-family: var(--display); font-size: 24px; }
.opt.yes { background: #E8FAEF; } .opt.no { background: #FFECEF; }
.grp { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 220px; font-family: var(--emoji); font-size: calc(var(--emsz) * .55); line-height: 1.1; }
.grp.small { font-size: calc(var(--emsz) * .4); max-width: 140px; }
.grp .gone { opacity: .3; position: relative; }
.grp .gone::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 5px; background: #E8302F; transform: rotate(-30deg); border-radius: 4px; }
.eq { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; background: #ffffff90; padding: 10px; border-radius: var(--r); }
.op { font-family: var(--display); font-size: 40px; }
.countbox { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 520px; background: #ffffff90; border-radius: var(--r); padding: 10px; }
.cnt { border: 0; background: none; font-family: var(--emoji); font-size: calc(var(--emsz) * .8); position: relative; padding: 2px; border-radius: 14px; }
.cnt.counted { background: #FFF1B8; }
.cnt.counted::after { content: attr(data-n); position: absolute; right: -2px; top: -4px; background: var(--ocean); color: #fff; font-family: var(--body); font-weight: 900; font-size: 15px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.field { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 10px; width: min(100%, 460px, calc(var(--cols) * 58vh / var(--rows))); }
.cell { aspect-ratio: 1; display: grid; place-items: center; }
.bub { width: 88%; aspect-ratio: 1; border-radius: 50%; border: 0; color: #fff; font-family: var(--display); font-weight: 700; font-size: clamp(26px, 7vmin, 44px); box-shadow: inset 0 -6px 0 #0002, 0 4px 0 #0002; text-shadow: 0 2px 0 #0003; }
.bub.done { opacity: .25; transform: scale(.8) !important; }
.sortcur { min-height: calc(var(--emsz) * 1.6); display: grid; place-items: center; }
.sortcur .fly { animation: fly .45s forwards; }
.bins { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 12px; width: min(100%, 620px); }
.bin { border: 0; border-radius: 26px 26px 34px 34px; background: #FFF3D1; box-shadow: 0 6px 0 #E1B969; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 130px; }
.bin-ic { font-family: var(--emoji); font-size: calc(var(--emsz) * .8); }
.bin-n { font-weight: 900; font-size: 16px; }
.bin-got { display: flex; flex-wrap: wrap; justify-content: center; font-family: var(--emoji); font-size: 22px; min-height: 26px; }
.memo { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: 10px; width: min(100%, 560px, calc(var(--cols) * 56vh / var(--rows) * .82)); }
.card { aspect-ratio: .82; border: 0; padding: 0; background: none; position: relative; perspective: 600px; }
.card > div { position: absolute; inset: 0; border-radius: 18px; display: grid; place-items: center; backface-visibility: hidden; transition: transform .35s; font-family: var(--emoji); font-size: calc(var(--emsz) * .8); box-shadow: 0 4px 0 var(--shadow); }
.card .back { background: linear-gradient(135deg, #8A63F2, #2B9BEA); color: #fff; font-size: 32px; }
.card .face { background: #fff; transform: rotateY(180deg); }
.card.up .back { transform: rotateY(180deg); }
.card.up .face { transform: rotateY(360deg); }
.card.got .face { background: #DDF8E6; }
.cups { position: relative; width: min(100%, 560px); height: calc(var(--cw) * 1.9); --cw: clamp(76px, 20vmin, 130px); }
.cup { position: absolute; bottom: 0; width: var(--cw); height: calc(var(--cw) * 1.1); border: 0; background: none; padding: 0; transition-property: left; transition-timing-function: ease-in-out; }
.cupimg { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.3, 1.4, .5, 1); z-index: 2; }
.cupimg svg { width: 100%; height: 100%; }
.cup.up .cupimg { transform: translateY(-62%); }
.ball { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); font-family: var(--emoji); font-size: calc(var(--cw) * .5); z-index: 1; }
.simon { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: min(100%, 360px, 60vh); aspect-ratio: 1; }
.pad { border: 0; border-radius: 28px; background: var(--c); opacity: .55; font-family: var(--emoji); font-size: calc(var(--emsz) * .9); box-shadow: 0 6px 0 #0002; transition: opacity .1s, transform .1s; }
.pad.lit { opacity: 1; transform: scale(1.06); box-shadow: 0 0 0 6px #fff, 0 0 30px var(--c); }
.saycard { background: #fff; border-radius: 28px; padding: 14px 30px; box-shadow: 0 6px 0 var(--shadow); text-align: center; }
.syl { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 7vmin, 44px); letter-spacing: .05em; color: var(--berry); }
.sayrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.meter { width: min(80%, 300px); height: 14px; border-radius: 99px; background: #ffffff90; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--leaf), var(--sun)); transition: width .08s; }
.sudowrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.sudoku { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; width: min(72vmin, 340px, 54vh); background: var(--ink); padding: 6px; border-radius: 18px; }
.sq { aspect-ratio: 1; border: 0; border-radius: 10px; background: #fff; font-family: var(--emoji); font-size: clamp(26px, 8vmin, 50px); display: grid; place-items: center; padding: 0; }
.sq.alt { background: #EAF4FF; }
.sq.hole { background: #FFF6D6; }
.sq.sel { box-shadow: inset 0 0 0 5px var(--ocean); animation: pulse 1s infinite; }
.sq.filled { background: #DDF8E6; }
.palette { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.palette .opt { min-height: 0; width: clamp(64px, 15vmin, 96px); aspect-ratio: 1; }
.palette .em { font-size: calc(var(--emsz) * .7); }
.stage.col { flex-direction: column !important; }
.maze, .dotsbox, .tracebox { position: relative; flex: 1; min-height: 0; width: 100%; align-self: stretch; }
.maze svg, .dotsbox svg, .tracebox svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.dt circle { fill: #fff; stroke: var(--ink); stroke-width: 1.2; }
.dt text { font-family: var(--display); font-weight: 700; fill: var(--ink); pointer-events: none; }
.dt.on circle { fill: var(--leaf); }
.dt.on text { fill: #fff; }
.dt.next circle { fill: var(--sun); animation: pulse 1s infinite; transform-box: fill-box; transform-origin: center; }
.pzwrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
.pz { display: grid; grid-template-columns: repeat(var(--c), 1fr); gap: 4px; width: min(70vmin, 360px, 56vh); aspect-ratio: 1; background: var(--ink); padding: 4px; border-radius: 16px; }
.pz.whole { gap: 0; }
.pz-t { border: 0; padding: 0; background-repeat: no-repeat; border-radius: 6px; }
.pz-t.sel { outline: 5px solid var(--sun); outline-offset: -5px; }
.pz-ref { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; }
.pz-ref img { width: 90px; height: 90px; border-radius: 14px; box-shadow: 0 4px 0 var(--shadow); }
.dressboy { display: flex; align-items: center; gap: 14px; background: #ffffff90; border-radius: var(--r); padding: 8px 16px; }
.worn { display: flex; flex-wrap: wrap; gap: 4px; min-width: 120px; max-width: 320px; }
.worn .em { font-size: calc(var(--emsz) * .7); }
.slots { display: flex; gap: 12px; }
.slot { width: calc(var(--emsz) * 1.4); height: calc(var(--emsz) * 1.4); border: 4px dashed var(--ink2); border-radius: 20px; display: grid; place-items: center; position: relative; background: #ffffff70; }
.slot b { position: absolute; top: -12px; left: -12px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-size: 15px; }
.slot.full { border-style: solid; border-color: var(--leaf); background: #fff; }
.songbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.piano { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; width: min(100%, 760px); flex: 1; max-height: 340px; min-height: 160px; }
.key { border: 0; border-radius: 0 0 20px 20px; background: var(--c); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 10px; box-shadow: inset 0 -10px 0 #0002; touch-action: none; }
.key .em { font-size: clamp(24px, 6vmin, 44px); }
.key small { font-weight: 900; color: #fff; text-shadow: 0 1px 0 #0004; font-size: 15px; }
.key.hit { animation: keyhit .25s; }
.key.next { box-shadow: inset 0 -10px 0 #0002, 0 0 0 5px #fff, 0 0 26px #fff; animation: pulse 1s infinite; }
.opt.hit { animation: pop .35s; }
.result { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: pop .5s; }
.result h2 { font-family: var(--display); font-size: clamp(24px, 6vmin, 36px); margin: 0; }
.res-stars { font-family: var(--emoji); font-size: clamp(44px, 12vmin, 72px); display: flex; gap: 6px; }
.res-stars span { filter: grayscale(1) opacity(.35); }
.res-stars span.on { filter: none; animation: pop .5s backwards; }

const DB = {
  db: null, p: null,
  open() {
    if (this.p) return this.p;
    this.p = new Promise(res => {
      try {
        const r = indexedDB.open('igroteka', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(this.db); };
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return this.p;
  },
  async get(k) {
    const db = await this.open(); if (!db) return null;
    return new Promise(res => { try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null); } catch (e) { res(null); } });
  },
  async set(k, v) {
    const db = await this.open(); if (!db) return false;
    return new Promise(res => { try { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch (e) { res(false); } });
  },
  async del(k) {
    const db = await this.open(); if (!db) return;
    return new Promise(res => { try { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch (e) { res(false); } });

function sceneSVG(rel, obj) {
  let s = `<line x1="6" y1="107" x2="154" y2="107" stroke="#B9A07A" stroke-width="4" stroke-linecap="round"/>`;
  const table = `<rect x="26" y="52" width="88" height="10" rx="3" fill="#D6955A" stroke="#6B4423" stroke-width="2.5"/><rect x="34" y="62" width="9" height="45" fill="#D6955A" stroke="#6B4423" stroke-width="2.5"/><rect x="97" y="62" width="9" height="45" fill="#D6955A" stroke="#6B4423" stroke-width="2.5"/>`;
  const box = `<path d="M48,66 L112,66 L108,107 L52,107 Z" fill="#E9B872" stroke="#8A5A2B" stroke-width="2.5"/><path d="M48,66 L36,56 M112,66 L124,56" stroke="#8A5A2B" stroke-width="2.5"/>`;
  const t = (x, y, sz = 26) => `<text x="${x}" y="${y}" font-size="${sz}" text-anchor="middle">${obj}</text>`;
  switch (rel) {
    case 'on': s += table + t(70, 49); break;
    case 'under': s += table + t(70, 103, 24); break;
    case 'near': s += table + t(138, 103, 24); break;
    case 'in': s += t(80, 86, 26) + box; break;
    case 'onbox': s += box + t(80, 63); break;
    case 'nearbox': s += box + t(138, 103, 24); break;
  }
  return `<svg class="scene" viewBox="0 0 160 116">${s}</svg>`;
}

/* ===== Для взрослых ===== */
function parentGate(onOk) {
  const a = 5 + rnd(5), b = 4 + rnd(5); let val = '';
  const disp = el('div', { class: 'gate-val' }, '_');
  const keys = el('div', { class: 'keypad' }, ...[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].map(k => el('button', { class: 'kp' + (k === '✓' ? ' go' : ''), onclick: () => {
    Sfx.tap();
    if (k === '⌫') val = val.slice(0, -1);
    else if (k === '✓') { if (+val === a + b) { ov.remove(); onOk(); return; } shake(disp); val = ''; }
    else if (val.length < 2) val += k;
    disp.textContent = val || '_';
  } }, String(k))));
  const ov = el('div', { class: 'modal', onclick: e => { if (e.target === ov) ov.remove(); } }, el('div', { class: 'modal-box' },
    el('p', { class: 'muted' }, 'Только для взрослых'),
    el('p', { class: 'big-q' }, `Сколько будет ${a} + ${b}?`), disp, keys,
    el('button', { class: 'btn ghost', onclick: () => ov.remove() }, 'Отмена')));
  document.body.append(ov);
}
